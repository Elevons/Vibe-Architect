<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { createRoot } from "react-dom/client";
import { StrictMode } from "react";
import { VibeArchitect } from "/src/components/VibeArchitect.tsx";
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const root = createRoot(document.body);
root.render(<StrictMode><VibeArchitect /></StrictMode>);
async function run() {
  await sleep(800);
  // Add a folder and a file via the toolbar Add menu.
  for (const label of ["Folder", "File"]) {
    const addButton = Array.from(document.querySelectorAll("button")).find(b => b.textContent === "Add ▾");
    addButton.click();
    await sleep(100);
    const menu = Array.from(document.querySelectorAll("div")).find(d => {
      const s = d.getAttribute("style") || "";
      return s.includes("position: fixed") && s.includes("z-index: 1100");
    });
    const item = Array.from(menu.querySelectorAll("button")).find(b => (b.textContent || "").trim() === label);
    item.click();
    await sleep(100);
  }
  await sleep(300);
  const cards = Array.from(document.querySelectorAll("[data-nodecard='true']"));
  const info = cards.map(c => ({
    left: c.style.left, top: c.style.top,
    title: (c.querySelector("span")||{}).textContent,
  }));
  const pre = document.createElement("pre");
  pre.id = "out";
  pre.textContent = "COUNT=" + cards.length + "\n" + JSON.stringify(info, null, 2);
  document.body.appendChild(pre);
  document.title = "PROBED";
}
run();
</script>
</body></html>
